@if (data?.title) {
<h1 mat-dialog-title>{{ data.title }}</h1>
} @if (data?.message) {
<div mat-dialog-content [innerHTML]="data.message"></div>
}
<mat-dialog-actions [align]="'end'">
  <button data-cy="close-dialog-button" mat-button mat-dialog-close color="primary" cdkFocusInitial>
    {{ data.closeButtonText ? data.closeButtonText : 'OK' }}
  </button>
</mat-dialog-actions>
