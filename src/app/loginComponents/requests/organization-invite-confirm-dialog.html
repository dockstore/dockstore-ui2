<h1 mat-dialog-title>{{data.approve ? 'Accept' : 'Decline'}} Invite to {{data.name}}</h1>

<div mat-dialog-content>
  <p>
    Are you sure you want to <strong>{{data.approve ? 'accept' : 'decline'}}</strong> the organization invite from
    <strong>{{data.name}}</strong>?
  </p>
</div>
<mat-dialog-actions [align]="'end'">
  <button mat-button (click)="onNoClick()">Cancel</button>
  @if (data.approve) {
  <span>
    <button
      mat-flat-button
      id="accept-pending-org-dialog"
      data-cy="approve-pending-org-dialog"
      [mat-dialog-close]="{ 'id': data.id, 'approve': data.approve }"
    >
      Accept
    </button>
  </span>
  } @else {
  <button
    mat-flat-button
    id="reject-pending-org-dialog"
    data-cy="reject-pending-org-dialog"
    [mat-dialog-close]="{ 'id': data.id, 'approve': data.approve }"
  >
    Decline
  </button>
  }
</mat-dialog-actions>
