<div>
  @for (group of groups; track group.label) {
  <div fxLayout="row" fxLayoutAlign="start start">
    <span style="font-size: 12px; text-align: right" fxFlex="0 0 8rem" class="mr-2">{{ group.label }}:</span>
    <mat-chip-set class="ml-2" fxFlex>
      <app-category-button
        *ngFor="let category of group.categories"
        [category]="category"
        [entryType]="entryType | lowercase"
      ></app-category-button>
    </mat-chip-set>
  </div>
  }
</div>
