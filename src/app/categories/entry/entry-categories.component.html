<div>
  @for (group of groups; track group.label) {
  <div class="group-row" fxLayout="row" fxLayoutAlign="start start">
    <span class="group-label mr-2">{{ group.label }}:</span>
    <mat-chip-set class="ml-2" fxFlex>
      <app-category-button
        *ngFor="let category of group.categories"
        [category]="category"
        [entryType]="entryType | lowercase"
      ></app-category-button>
    </mat-chip-set>
  </div>
  }
</div>
