<mat-chip
  class="pointer small-chip"
  style="padding: 1px"
  data-cy="categoriesBubble"
  [routerLink]="routerLink"
  [queryParams]="queryParams"
  [ngClass]="className"
  [matTooltip]="category.topic"
  (click)="$event.stopPropagation(); $event.preventDefault()"
>
  {{ category.displayName }}
</mat-chip>
