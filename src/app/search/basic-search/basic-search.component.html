<mat-expansion-panel expanded>
  <mat-expansion-panel-header> Search </mat-expansion-panel-header>
  <mat-form-field class="w-100">
    <mat-label>Enter search term...</mat-label>
    <input
      matInput
      #search
      #trigger="matAutocompleteTrigger"
      [matAutocomplete]="auto"
      [formControl]="searchFormControl"
      matTooltip="Press &lt;Enter&gt; to search"
      [matTooltipPosition]="'above'"
      list="suggestions"
      type="text"
      (keydown.enter)="submitSearch(); trigger.closePanel()"
      data-cy="basic-search"
    />
    @if (search.value) {
    <button matSuffix mat-icon-button (click)="clearSearch()">
      <mat-icon>close</mat-icon>
    </button>
    }
  </mat-form-field>
  <mat-autocomplete #auto="matAutocomplete" (optionSelected)="submitSearch()">
    @for (option of autocompleteTerms$ | async; track option) {
    <mat-option [value]="option">{{ option }}</mat-option>
    }
  </mat-autocomplete>
  <div class="mt-2"><a data-cy="advanced-search" (click)="openAdvancedSearch()"> Open Advanced Search </a></div>
</mat-expansion-panel>
