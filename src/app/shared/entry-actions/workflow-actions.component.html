@if (showButtons) {
<div class="flex-wrap-gap" fxLayout="row" fxLayoutAlign="end start" fxLayoutGap="0.5rem">
  @if (workflow?.is_published) {
  <a
    [routerLink]="['/' + entryType + 's/', workflow.full_workflow_path]"
    data-cy="viewPublicWorkflowButton"
    mat-button
    color="accent"
    [disabled]="isRefreshing$ | async"
    [matTooltip]="viewPublicMessage"
  >
    View public page
  </a>
  } @if (!workflow?.archived) {
  <div [matTooltip]="pubUnpubMessage">
    <button
      mat-flat-button
      class="accent-1-dark"
      id="publishButton"
      [attr.data-cy]="(workflow?.is_published ? 'unpublish' : 'publish') + '-button'"
      (click)="publishToggle()"
      [disabled]="(isRefreshing$ | async) || publishDisabled"
    >
      {{ workflow?.is_published ? 'Unpublish' : 'Publish' }}
    </button>
  </div>
  @if (!isHosted && canWrite && workflow?.mode !== WorkflowModel.ModeEnum.DOCKSTOREYML) {
  <button
    mat-flat-button
    class="accent-1-dark"
    (click)="refresh()"
    [disabled]="isRefreshing$ | async"
    matTooltip="Sync the {{ entryType }} with the source control repository"
    data-cy="refreshButton"
  >
    {{ 'Refresh' }}
  </button>
  } @if (workflow?.deletable) {
  <button
    mat-flat-button
    class="accent-1-dark"
    (click)="delete()"
    [disabled]="isRefreshing$ | async"
    matTooltip="Delete this {{ entryType }}"
    data-cy="deleteButton"
  >
    Delete
  </button>
  } @if (!workflow?.deletable) {
  <button
    mat-flat-button
    class="accent-1-dark"
    (click)="archive()"
    [disabled]="isRefreshing$ | async"
    matTooltip="Archive this {{ entryType }}"
    data-cy="archiveButton"
  >
    Archive
  </button>
  } } @if (workflow?.archived) {
  <button
    mat-flat-button
    class="accent-1-dark"
    (click)="unarchive()"
    [disabled]="isRefreshing$ | async"
    matTooltip="Unarchive this {{ entryType }}"
    data-cy="unarchiveButton"
  >
    Unarchive
  </button>
  }
</div>
}
