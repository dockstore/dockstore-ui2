@if (showError$ | async) {
<mat-card appearance="outlined" class="alert alert-danger" role="alert">
  <mat-card-content>
    <button type="button" class="close" data-dismiss="alert" (click)="clear()">&times;</button>
    <p>
      <mat-icon class="alert-danger-icon">warning</mat-icon>
      {{ message$ | async }}
    </p>
    <p class="error-output">{{ details$ | async }}</p>
  </mat-card-content>
</mat-card>
} @if (showInfo$ | async) {
<div>
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
</div>
} @else {
<div class="pt-2"></div>
}
